spring.application.name=payment

spring.datasource.url=jdbc:h2:mem:payment;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# 0.0 ~ 1.0, 해당 확률로 PG SYSTEM_ERROR 발생시켜 테스트
payment.gateway.fake.failure-rate=0.3
# 가짜 PG 응답 지연(ms), 타임아웃 테스트용
payment.gateway.fake.latency-ms=2
# PG 응답 대기 제한 시간(ms), 초과 시 SYSTEM_ERROR 처리
payment.gateway.timeout-ms=3000
